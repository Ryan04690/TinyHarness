[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyharness"
version = "0.2.0"
description = "A minimal agent harness built from scratch for learning and experimentation."
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tinyharness*"]